services:
  steadily:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/steadily", "-config", "/app/steadily.yaml"]
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ./steadily.yaml:/app/steadily.yaml
    depends_on:
      - echo1
      - echo2
      - echo3

  echo1:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/echo-backend", "-addr", ":8081"]
    ports:
      - "8081:8081"

  echo2:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/echo-backend", "-addr", ":8082"]
    ports:
      - "8082:8082"

  echo3:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/echo-backend", "-addr", ":8083"]
    ports:
      - "8083:8083"

  prometheus:
    image: prom/prometheus:latest
    container_name: steadily-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: steadily-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
