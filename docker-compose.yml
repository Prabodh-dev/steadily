services:
  steadily:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/steadily", "-config", "/app/steadily.yaml"]
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ./steadily.yaml:/app/steadily.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 3
      start_period: 3s
    depends_on:
      echo1:
        condition: service_healthy
      echo2:
        condition: service_healthy
      echo3:
        condition: service_healthy

  echo1:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/echo-backend", "-addr", ":8081"]
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/health || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 3
      start_period: 2s

  echo2:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/echo-backend", "-addr", ":8082"]
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/health || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 3
      start_period: 2s

  echo3:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/echo-backend", "-addr", ":8083"]
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/health || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 3
      start_period: 2s

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: steadily-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:11.2.0
    container_name: steadily-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
